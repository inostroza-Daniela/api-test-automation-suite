name: Tests de API

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 11 * * 1-5'
  workflow_dispatch:
    inputs:
      grep:
        description: Filtro de tag o título que se pasa a --grep (por ejemplo @smoke)
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    name: Lint, tipos y formato
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

  api-tests:
    name: Tests de API
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_ENV: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Ejecutar tests
        run: npx playwright test ${GREP:+--grep "$GREP"}
        env:
          GREP: ${{ github.event.inputs.grep }}
      - name: Subir reporte HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Subir resultados JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-results
          path: test-results/junit.xml
          retention-days: 14

  docker-smoke:
    name: Smoke tests en Docker
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Construir imagen
        run: docker build --tag api-test-automation-suite .
      - name: Ejecutar smoke tests
        run: docker run --rm --env CI=true api-test-automation-suite --grep @smoke
